name: Security Audit

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Audit exact locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          bun audit | tee bun-audit.txt

      - name: Upload dependency audit report
        if: always() && hashFiles('bun-audit.txt') != ''
        uses: actions/upload-artifact@v5
        with:
          name: dependency-audit-report
          path: bun-audit.txt
          retention-days: 14

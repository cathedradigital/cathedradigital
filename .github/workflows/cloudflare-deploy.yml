name: Deploy Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Never cancel an in-flight production deployment. A newer run may wait in the
# Actions queue, but it must not interrupt a deployment halfway through.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Guard manual production deployments
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deployment is allowed only from refs/heads/main. Selected ref: ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove historical unsanitized Playwright artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request DELETE \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/cathedradigital/cathedradigital/actions/artifacts/11866733452")"
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Historical unsanitized artifact removed or already absent (HTTP $status)."
          else
            echo "::error::Could not remove historical unsanitized artifact (HTTP $status); blocking production deployment."
            exit 1
          fi

      - name: Verify required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$E2E_TEST_EMAIL" || { echo "::error::Missing GitHub secret E2E_TEST_EMAIL"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::Missing GitHub secret E2E_TEST_PASSWORD"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Cloudflare authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inspect public DNS
        shell: bash
        run: |
          set -euo pipefail
          for name in cathedradigital.com.br www.cathedradigital.com.br cathedradigital.cathedradigital.workers.dev; do
            echo "=== DNS $name ==="
            for type in A AAAA CNAME NS; do
              echo "-- $type"
              curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://dns.google/resolve?name=$name&type=$type" | jq '{Status,Answer}'
            done
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Validate internal routes
        run: npm run validate:links

      - name: Build
        run: npm run build

      - name: Test Playwright artifact sanitizer
        run: python3 scripts/test-sanitize-playwright-artifacts.py

      # Publication gate: production must not deploy unless the same commit has
      # passed the critical authenticated E2E suite on desktop and mobile.
      - name: Install Playwright for the publication gate
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run critical authenticated Estudar E2E
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: "true"
        run: npx playwright test e2e/estudar-critical.spec.ts e2e/site-route-smoke.spec.ts

      - name: Verify current production UI and SEO before deploy
        env:
          CI: "true"
        run: npx playwright test e2e/production-smoke.spec.ts --project=desktop-chromium

      # Preserve failure evidence, but never upload unsanitized authenticated traces.
      - name: Sanitize Playwright evidence
        id: sanitize-deploy-traces
        if: ${{ !cancelled() }}
        run: python3 scripts/sanitize-playwright-artifacts.py

      - name: Upload deployment E2E evidence
        if: ${{ !cancelled() && steps.sanitize-deploy-traces.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: production-gate-e2e-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed production UI and SEO in browser
        env:
          CI: "true"
        run: npx playwright test e2e/production-smoke.spec.ts --project=desktop-chromium

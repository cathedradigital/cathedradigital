name: Deploy Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify deployment and Supabase build configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing GitHub secret VITE_SUPABASE_URL — refusing to build with the legacy Supabase fallback"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub secret VITE_SUPABASE_PUBLISHABLE_KEY — refusing to build with the legacy Supabase fallback"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"
      - name: Inspect public DNS
        shell: bash
        run: |
          set -euo pipefail
          for name in cathedradigital.com.br www.cathedradigital.com.br cathedradigital.cathedradigital.workers.dev; do
            echo "=== DNS $name ==="
            for type in A AAAA CNAME NS; do
              echo "-- $type"
              curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://dns.google/resolve?name=$name&type=$type" | jq '{Status,Answer}'
            done
          done
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Validate internal routes
        run: npm run validate:links

      - name: Normalize and validate Supabase project URL
        id: supabase-url
        env:
          RAW_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.RAW_SUPABASE_URL;
          let url;
          try { url = new URL(raw); } catch { throw new Error('VITE_SUPABASE_URL must be a valid project URL'); }
          console.log('Configured Supabase project host:', url.hostname);
          if (url.protocol !== 'https:' || url.hostname !== 'isojguvcnfncokoxoauk.supabase.co') {
            throw new Error('VITE_SUPABASE_URL must target the configured production project; legacy or unrelated Supabase projects are rejected');
          }
          if (url.pathname === '/rest/v1' || url.pathname === '/rest/v1/') url.pathname = '/';
          if (url.pathname !== '/' || url.search || url.hash) {
            throw new Error('VITE_SUPABASE_URL must point to the project root; unexpected URL path/query detected');
          }
          console.log('Validated Supabase project host:', url.hostname);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + url.origin + '\n');
          NODE
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase-url.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Validate production UI and SEO endpoints
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "https://cathedradigital.com.br"
            "https://www.cathedradigital.com.br"
            "https://cathedradigital.cathedradigital.workers.dev"
          )
          for url in "${endpoints[@]}"; do
            echo "Checking actual UI shell: $url"
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output "$body_file" --write-out "%{http_code}" "$url" || true)"
            size="$(wc -c < "$body_file")"

            if [ "$status" != "200" ]; then
              echo "::error::$url returned HTTP $status; reachability/403 is not proof of a published UI"
              rm -f "$body_file"
              exit 1
            fi
            if [ "$size" -le 100 ]; then
              echo "::error::$url returned an unexpectedly small body ($size bytes)"
              rm -f "$body_file"
              exit 1
            fi
            if ! grep -Eiq '<html([[:space:]>])' "$body_file"; then
              echo "::error::$url did not return an HTML document"
              rm -f "$body_file"
              exit 1
            fi
            if ! grep -Eiq '<title>[^<]*(Cátedra|Cathedra)[^<]*Digital' "$body_file"; then
              echo "::error::$url HTML title does not identify the Cátedra Digital application"
              rm -f "$body_file"
              exit 1
            fi
            if ! grep -Eiq '(src|href)="[^"]*/assets/[^"]+"' "$body_file"; then
              echo "::error::$url HTML does not reference built application assets"
              rm -f "$body_file"
              exit 1
            fi
            echo "OK $url -> HTTP 200; verified HTML title and built asset references ($size bytes)"
            rm -f "$body_file"
          done

          for path in robots.txt sitemap.xml; do
            url="https://www.cathedradigital.com.br/$path"
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output "$body_file" --write-out "%{http_code}" "$url" || true)"
            size="$(wc -c < "$body_file")"
            if [ "$status" != "200" ] || [ "$size" -le 20 ]; then
              echo "::error::$url failed validation (HTTP $status, $size bytes)"
              rm -f "$body_file"
              exit 1
            fi
            case "$path" in
              robots.txt)
                grep -Eiq '^User-agent:' "$body_file" || { echo "::error::robots.txt has no User-agent directive"; rm -f "$body_file"; exit 1; }
                grep -Eiq '^Sitemap: https://www\.cathedradigital\.com\.br/sitemap\.xml' "$body_file" || { echo "::error::robots.txt does not reference the canonical sitemap"; rm -f "$body_file"; exit 1; }
                ;;
              sitemap.xml)
                grep -Eiq '<urlset([[:space:]>])' "$body_file" || { echo "::error::sitemap.xml has no urlset root"; rm -f "$body_file"; exit 1; }
                grep -Fq 'https://www.cathedradigital.com.br' "$body_file" || { echo "::error::sitemap.xml has no canonical production URLs"; rm -f "$body_file"; exit 1; }
                ;;
            esac
            echo "OK $url -> HTTP 200; content structure verified ($size bytes)"
            rm -f "$body_file"
          done

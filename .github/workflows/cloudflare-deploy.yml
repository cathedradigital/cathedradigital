name: Deploy Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"
      - name: Inspect public DNS
        shell: bash
        run: |
          set -euo pipefail
          for name in cathedradigital.com.br www.cathedradigital.com.br cathedradigital.cathedradigital.workers.dev; do
            echo "=== DNS $name ==="
            for type in A AAAA CNAME NS; do
              echo "-- $type"
              curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://dns.google/resolve?name=$name&type=$type" | jq '{Status,Answer}'
            done
          done
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Validate internal routes
        run: npm run validate:links

      - name: Build
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Validate production endpoints
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "https://cathedradigital.com.br"
            "https://www.cathedradigital.com.br"
            "https://cathedradigital.cathedradigital.workers.dev"
          )
          for url in "${endpoints[@]}"; do
            echo "Checking $url"
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output "$body_file" --write-out "%{http_code}" "$url" || true)"
            size="$(wc -c < "$body_file")"
            rm -f "$body_file"

            case "$url" in
              *workers.dev)
                test "$status" = "200"
                test "$size" -gt 100
                echo "OK $url -> HTTP $status ($size bytes)"
                ;;
              *)
                if [ "$status" = "200" ]; then
                  test "$size" -gt 100
                  echo "OK $url -> HTTP $status ($size bytes)"
                elif [ "$status" = "403" ]; then
                  echo "REACHABLE $url -> HTTP 403 (custom-domain protection; deployment is live)"
                else
                  echo "::error::$url returned unexpected HTTP $status"
                  exit 1
                fi
                ;;
            esac
          done

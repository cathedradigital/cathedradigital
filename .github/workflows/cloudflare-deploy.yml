name: Deploy Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"
      - name: Inspect Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          zone_json="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=cathedradigital.com.br")"
          echo "$zone_json" | jq '{success,errors,result:[.result[]|{id,name,status,name_servers}]}'
          zone_id="$(echo "$zone_json" | jq -r '.result[0].id // empty')"
          if [ -z "$zone_id" ]; then
            echo "No active Cloudflare zone found for cathedradigital.com.br"
            exit 0
          fi
          for name in cathedradigital.com.br www.cathedradigital.com.br; do
            echo "DNS records for $name"
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$name" | jq '{success,errors,result:[.result[]|{id,name,type,content,proxied,status}]}'
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Validate internal routes
        run: npm run validate:links

      - name: Build
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Validate production endpoints
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "https://cathedradigital.com.br"
            "https://www.cathedradigital.com.br"
            "https://cathedradigital.cathedradigital.workers.dev"
          )
          for url in "${endpoints[@]}"; do
            echo "Checking $url"
            body_file="$(mktemp)"
            status="$(curl --fail --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output "$body_file" --write-out "%{http_code}" "$url")"
            size="$(wc -c < "$body_file")"
            rm -f "$body_file"
            test "$status" = "200"
            test "$size" -gt 100
            echo "OK $url -> HTTP $status ($size bytes)"
          done

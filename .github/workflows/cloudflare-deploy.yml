name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI", "Estudar E2E", "Security Audit", "Estudar final audit"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - name: Verify all release gates on the exact SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const branch = context.payload.workflow_run.head_branch;
            if (branch !== "main") {
              core.setFailed(`Refusing deployment from branch ${branch}`);
              return;
            }

            const required = ["CI", "Estudar E2E", "Security Audit", "Estudar final audit"];
            const deadline = Date.now() + 45 * 60 * 1000;
            let passed = false;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: "main",
                head_sha: sha,
                per_page: 100,
              });

              const states = required.map(name => {
                const matching = data.workflow_runs
                  .filter(run => run.name === name && run.head_sha === sha && run.head_branch === "main")
                  .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
                return { name, run: matching[0] };
              });

              const failed = states.find(({ run }) => run && run.status === "completed" && run.conclusion !== "success");
              if (failed) {
                core.setFailed(`Release blocked: ${failed.name} concluded ${failed.run.conclusion} on ${sha}`);
                return;
              }

              const missing = states.filter(({ run }) => !run);
              const pending = states.filter(({ run }) => run && run.status !== "completed");
              const unsuccessful = states.filter(({ run }) => run && run.status === "completed" && run.conclusion !== "success");

              if (missing.length === 0 && pending.length === 0 && unsuccessful.length === 0) {
                for (const { name, run } of states) {
                  core.info(`PASS ${name}: ${run.conclusion} (${run.html_url})`);
                }
                passed = true;
                break;
              }

              core.info(`Waiting for same-SHA release gates. Missing: ${missing.map(x => x.name).join(", ") || "none"}; pending: ${pending.map(x => x.name).join(", ") || "none"}.`);
              await new Promise(resolve => setTimeout(resolve, 30000));
            }

            if (!passed) {
              core.setFailed(`Release blocked: release gates did not all succeed on ${sha} within 45 minutes.`);
              return;
            }

            await core.summary
              .addHeading("Release gates")
              .addRaw(`All required workflows passed on SHA ${sha}: CI, final audit, authenticated/public Playwright, and Security Audit.`)
              .write();

      - name: Checkout the exact validated SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami --account "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inspect public DNS
        shell: bash
        run: |
          set -euo pipefail
          for name in cathedradigital.com.br www.cathedradigital.com.br cathedradigital.cathedradigital.workers.dev; do
            echo "=== DNS $name ==="
            for type in A AAAA CNAME NS; do
              echo "-- $type"
              curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://dns.google/resolve?name=$name&type=$type" | jq '{Status,Answer}'
            done
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Validate internal routes
        run: npm run validate:links

      - name: Validate explicit Supabase build target and build
        run: |
          set -euo pipefail
          set -a
          . ./.env.production
          set +a
          node scripts/validate-supabase-build-env.mjs
          npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Validate production endpoints and SEO resources
        shell: bash
        run: |
          set -euo pipefail
          worker="https://cathedradigital.cathedradigital.workers.dev"
          domains=("https://cathedradigital.com.br" "https://www.cathedradigital.com.br")

          check_url() {
            local url="$1"
            local expected="$2"
            local body_file headers_file status size
            body_file="$(mktemp)"
            headers_file="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 1 --retry-all-errors --connect-timeout 10 --max-time 30 --dump-header "$headers_file" --output "$body_file" --write-out "%{http_code}" "$url" || true)"
            size="$(wc -c < "$body_file")"
            echo "=== $url -> HTTP $status ($size bytes) ==="

            if grep -Eiq '^cf-mitigated:[[:space:]]*challenge' "$headers_file"; then
              echo "Response headers (safe subset):"
              awk 'BEGIN { IGNORECASE=1 } /^HTTP\// || /^(server|cf-ray|cf-mitigated|cf-cache-status|content-type|location|cf-access-denied|www-authenticate):/ { print }' "$headers_file"
              rm -f "$body_file" "$headers_file"
              echo "::error::Cloudflare challenge intercepted $url. Production accessibility is unverified; release validation must fail."
              return 1
            fi

            if [ "$status" != "200" ] || [ "$size" -lt "$expected" ]; then
              echo "Response headers (safe subset):"
              awk 'BEGIN { IGNORECASE=1 } /^HTTP\// || /^(server|cf-ray|cf-mitigated|cf-cache-status|content-type|location|cf-access-denied|www-authenticate):/ { print }' "$headers_file"
              rm -f "$body_file" "$headers_file"
              echo "::error::$url failed production HTTP validation"
              return 1
            fi

            rm -f "$body_file" "$headers_file"
            echo "OK $url"
            return 0
          }

          check_url "$worker" 100

          for domain in "${domains[@]}"; do
            check_url "$domain" 100
          done

          check_url "$worker/robots.txt" 1
          check_url "$worker/sitemap.xml" 100
          robots="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$worker/robots.txt")"
          sitemap="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$worker/sitemap.xml")"
          grep -Eiq '^User-agent:' <<< "$robots"
          grep -Eiq '<(urlset|sitemapindex)([ >])' <<< "$sitemap"
          echo "OK robots.txt directives and sitemap XML structure on Worker"

          for domain in "${domains[@]}"; do
            for resource in robots.txt sitemap.xml; do
              expected=100
              if [ "$resource" = "robots.txt" ]; then expected=1; fi
              check_url "$domain/$resource" "$expected"
            done
          done

          echo "All production endpoints and SEO resources returned HTTP 200 without Cloudflare challenges."

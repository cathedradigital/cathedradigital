name: Estudar validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "agent/master-estudar-final-restoration-*"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Internal route validation
        run: npm run validate:links

      - name: Build and typecheck
        run: npm run build

name: Estudar final audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "agent/master-estudar-final-audit-*"

permissions:
  contents: read

jobs:
  security-audit:
    name: Security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate security boundaries
        run: npm run validate:security

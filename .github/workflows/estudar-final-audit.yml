name: Estudar final audit

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "main"
      - "agent/master-estudar-final-audit-*"

permissions:
  contents: read

jobs:
  security-boundaries:
    name: Security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies (frozen lockfile)
        run: bun ci

      - name: Validate security boundaries
        run: bun run validate:security

name: Generate npm lockfile

on:
  push:
    branches: ["audit/hardening-2026-10-30"]
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Apply non-breaking dependency security fixes to the lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: lock patched esbuild dependency tree"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

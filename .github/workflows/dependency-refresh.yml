name: Refresh vulnerable locked dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dependency-refresh.yml"
      - "package.json"
      - "bun.lock"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dependency/refresh-20261104'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted dependency branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Refresh compatible locked dependencies
        run: bun update

      - name: Commit refreshed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            echo "No compatible dependency updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(deps): refresh vulnerable locked packages"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Re-audit refreshed lockfile
        run: bun audit

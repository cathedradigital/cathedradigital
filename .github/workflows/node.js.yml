name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cloudflare Workers Builds uses Node/npm; keep CI on the same install path.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Export resolved npm lockfile for migration to reproducible installs
        uses: actions/upload-artifact@v5
        with:
          name: npm-lockfile-${{ github.sha }}
          path: package-lock.json
          retention-days: 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --quiet

      - name: Validate internal routes
        run: npm run validate:links

      - name: Build (Cloudflare)
        run: npm run build

name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 runs tooling; Bun installs the exact dependency graph from bun.lock.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install dependencies (frozen lockfile)
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint -- --quiet

      - name: Validate internal routes
        run: bun run validate:links

      - name: Build (Cloudflare)
        run: |
          set -euo pipefail
          set -a
          source .env.production
          set +a
          node scripts/validate-supabase-build-env.mjs
          bun run build

name: Estudar E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/estudar-e2e.yml"
  workflow_dispatch:

concurrency:
  group: estudar-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E — PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun with dependency cache
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.55.0

      - name: Install locked application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright test runner without changing project lockfile
        run: bun add --no-save @playwright/test@1.55.0

      - name: Install Chromium and required system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Verify Supabase test configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL — app build would not target the intended Supabase project"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY — app build would not initialize Supabase"; exit 1; }

      - name: Build PR HEAD
        run: bun run build

      - name: Verify authenticated E2E account exists
        run: |
          test -n "$E2E_TEST_EMAIL" || { echo "::error::Missing E2E_TEST_EMAIL — authenticated E2E is blocked"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::Missing E2E_TEST_PASSWORD — authenticated E2E is blocked"; exit 1; }

      - name: Run critical Estudar E2E
        run: bunx playwright test e2e/estudar-critical.spec.ts

      - name: Sanitize sensitive headers in Playwright traces
        id: sanitize-traces
        if: ${{ !cancelled() }}
        run: python3 scripts/sanitize-playwright-artifacts.py

      - name: Upload Playwright evidence
        if: ${{ !cancelled() && steps.sanitize-traces.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: estudar-e2e-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: Estudar E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/test-safe-playwright-evidence.mjs"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/estudar-e2e.yml"
  workflow_dispatch:

concurrency:
  group: estudar-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E — PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install application dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Supabase and authenticated E2E secrets exist
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL — app build/auth is blocked"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY — app build/auth is blocked"; exit 1; }
          test -n "$E2E_TEST_EMAIL" || { echo "::error::Missing E2E_TEST_EMAIL — authenticated E2E is blocked"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::Missing E2E_TEST_PASSWORD — authenticated E2E is blocked"; exit 1; }

      - name: Build PR HEAD with the configured Supabase project
        run: npm run build

      - name: Verify safe evidence handling with synthetic values
        run: node scripts/test-safe-playwright-evidence.mjs

      - name: Check E2E secrets are configured (not a validity check)
        run: |
          test -n "$E2E_TEST_EMAIL" || { echo "::error::Missing E2E_TEST_EMAIL — authenticated E2E is blocked"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::Missing E2E_TEST_PASSWORD — authenticated E2E is blocked"; exit 1; }
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Prove successful authenticated login on desktop and mobile
        run: >-
          npx playwright test e2e/estudar-critical.spec.ts
          --grep "auth diagnostic records safe form"
          --project=chromium
          --project=mobile-chrome
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run complete Playwright suite
        run: npx playwright test
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Validate sanitized Playwright evidence
        id: safe_evidence
        if: always()
        run: node e2e/verify-safe-playwright-evidence.mjs
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Upload sanitized Playwright evidence
        if: ${{ !cancelled() && steps.safe_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: estudar-e2e-safe-evidence
          path: safe-playwright-evidence/report.json
          retention-days: 7

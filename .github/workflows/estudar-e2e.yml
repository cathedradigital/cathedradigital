name: Estudar E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/sanitize-playwright-artifacts.py"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/estudar-e2e.yml"
  workflow_dispatch:

concurrency:
  group: estudar-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E — PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # The browser bundle must target the same Supabase project as the E2E account.
      # Without these build-time Vite variables, publicConfig.ts falls back to a legacy project.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install application dependencies
        run: npm install

      - name: Install Playwright for this CI run only
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Normalize and validate Supabase project URL
        id: supabase-url
        env:
          RAW_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.RAW_SUPABASE_URL;
          let url;
          try { url = new URL(raw); } catch { throw new Error('VITE_SUPABASE_URL must be a valid project URL'); }
          console.log('Configured Supabase project host:', url.hostname);
          if (url.protocol !== 'https:' || url.hostname !== 'isojguvcnfncokoxoauk.supabase.co') {
            throw new Error('VITE_SUPABASE_URL must target the configured production project; legacy or unrelated Supabase projects are rejected');
          }
          // Supabase's Project URL is the origin. Some dashboards expose the Data API URL with /rest/v1.
          if (url.pathname === '/rest/v1' || url.pathname === '/rest/v1/') url.pathname = '/';
          if (url.pathname !== '/' || url.search || url.hash) {
            throw new Error('VITE_SUPABASE_URL must point to the project root; unexpected URL path/query detected');
          }
          const normalized = url.origin;
          console.log('Validated Supabase project host:', url.hostname);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + normalized + '\n');
          NODE
      - name: Build PR HEAD
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase-url.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify authenticated E2E account can sign in
        env:
          SUPABASE_URL: ${{ steps.supabase-url.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$E2E_TEST_EMAIL" || { echo "::error::Missing E2E_TEST_EMAIL — authenticated E2E is blocked"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::Missing E2E_TEST_PASSWORD — authenticated E2E is blocked"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "::error::Missing validated Supabase project URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing Supabase publishable key"; exit 1; }
          node --input-type=module <<'NODE'
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          const email = process.env.E2E_TEST_EMAIL;
          const password = process.env.E2E_TEST_PASSWORD;
          const response = await fetch(new URL('/auth/v1/token?grant_type=password', url), {
            method: 'POST',
            headers: { 'content-type': 'application/json', apikey: key },
            body: JSON.stringify({ email, password }),
          });
          if (!response.ok) {
            // Never print request data or Supabase response bodies: keep credentials and account details out of CI logs.
            const status = response.status;
            await response.arrayBuffer();
            console.error(`::error::E2E sign-in preflight failed (HTTP ${status}). The GitHub Actions E2E_TEST_EMAIL/E2E_TEST_PASSWORD secrets do not authenticate against the configured Supabase project. Update them to the confirmed test account credentials for this project; the browser suite was not started.`);
            process.exit(1);
          }
          const payload = await response.json();
          if (!payload.access_token || !payload.user?.id) {
            console.error('::error::Supabase accepted the sign-in request but returned no authenticated session; E2E was not started.');
            process.exit(1);
          }
          console.log('Authenticated E2E preflight passed for the configured Supabase project.');
          NODE

      - name: Run critical Estudar E2E
        run: npx playwright test e2e/estudar-critical.spec.ts

      - name: Sanitize sensitive headers in Playwright traces
        id: sanitize-traces
        if: ${{ !cancelled() }}
        run: python3 scripts/sanitize-playwright-artifacts.py

      # The HTML report includes attachments; uploading test-results/ too duplicates large videos and traces.
      - name: Upload Playwright evidence
        if: ${{ !cancelled() && steps.sanitize-traces.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: estudar-e2e-evidence
          path: playwright-report/
          retention-days: 7
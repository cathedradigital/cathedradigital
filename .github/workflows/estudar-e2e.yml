name: Estudar E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "e2e/**"
      - "scripts/sanitize-playwright-artifacts.py"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/estudar-e2e.yml"
  workflow_dispatch:

concurrency:
  group: estudar-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E — PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # The browser bundle must target the same Supabase project as the E2E account.
      # Without these build-time Vite variables, publicConfig.ts falls back to a legacy project.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install application dependencies
        run: npm install

      - name: Install Playwright for this CI run only
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Normalize and validate Supabase project URL
        id: supabase-url
        env:
          RAW_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.RAW_SUPABASE_URL;
          let url;
          try { url = new URL(raw); } catch { throw new Error('VITE_SUPABASE_URL must be a valid project URL'); }
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.supabase.co')) {
            throw new Error('VITE_SUPABASE_URL must be the HTTPS Supabase project URL, not a REST endpoint or API gateway URL');
          }
          // Supabase's Project URL is the origin. Some dashboards expose the Data API URL with /rest/v1.
          if (url.pathname === '/rest/v1' || url.pathname === '/rest/v1/') url.pathname = '/';
          if (url.pathname !== '/' || url.search || url.hash) {
            throw new Error('VITE_SUPABASE_URL must point to the project root; unexpected URL path/query detected');
          }
          const normalized = url.origin;
          console.log('Validated Supabase project host:', url.hostname);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + normalized + '\n');
          NODE
      - name: Build PR HEAD
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase-url.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify authenticated E2E account exists
        run: |
          test -n "$E2E_TEST_EMAIL" || { echo "::error::Missing E2E_TEST_EMAIL — authenticated E2E is blocked"; exit 1; }
          test -n "$E2E_TEST_PASSWORD" || { echo "::error::Missing E2E_TEST_PASSWORD — authenticated E2E is blocked"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing VITE_SUPABASE_URL — E2E build would use the legacy fallback project"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing VITE_SUPABASE_PUBLISHABLE_KEY — E2E build cannot connect to the configured Supabase project"; exit 1; }

      - name: Run critical Estudar E2E
        run: npx playwright test e2e/estudar-critical.spec.ts

      - name: Sanitize sensitive headers in Playwright traces
        id: sanitize-traces
        if: ${{ !cancelled() }}
        run: python3 scripts/sanitize-playwright-artifacts.py

      # The HTML report includes attachments; uploading test-results/ too duplicates large videos and traces.
      - name: Upload Playwright evidence
        if: ${{ !cancelled() && steps.sanitize-traces.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: estudar-e2e-evidence
          path: playwright-report/
          retention-days: 7